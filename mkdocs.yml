site_name: Fortify DevOps Guide
base_url: /fortify-dev-guide
repo_url: https://github.com/treisland/fortify_docs_mkdocs
extra_css:
  - stylesheets/extra.css
theme:
  name: material
  custom_dir: overrides
  font:
    text: Poppins
  logo: assets/cyberres-opentext.png
  favicon: assets/logo-fortify.png
  palette:
    - scheme: default
      primary: black
      accent: blue
      toggle:
        icon: material/brightness-7 
        name: Switch to dark mode

    # Palette toggle for dark mode
    - scheme: slate
      primary: black
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - announce.dismiss
    - content.code.annotate
    - content.code.copy
    - content.tabs.link
    - content.tooltips
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.path
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.suggest
    
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.inlinehilite
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
          - name: mermaid
            class: mermaid
            format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true 
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.emoji:
      emoji_index: !!python/name:materialx.emoji.twemoji
      emoji_generator: !!python/name:materialx.emoji.to_svg
      options:
        custom_icons:
          - overrides/.icons
  - toc:
      permalink: true
      title: Table Of Contents

plugins:
  - glightbox
  - macros
  - mkdocs-video
  - search
nav:
  - Home: index.md
  - Guides:
    - IDE Integrations: 
      - 'ide/README.md'
      - Eclipse: 'ide/eclipse.md'
      - IntelliJ: 'ide/intellij.md'
      - VSCode: 'ide/vscode.md'
      - Visual Studio: 'ide/visualstudio.md'
    - CI/CD Integrations: 
      - 'cicd/README.md'
      - Azure DevOps: 'cicd/azuredevops.md'
      - Github: 'cicd/github.md'
      - Gitlab: 'cicd/gitlab.md'
      - Jenkins: 'cicd/jenkins.md'
    - BugTrackers: 
      - 'bugtracker/README.md'
      - Azure DevOps: 'bugtracker/azuredevops.md'
      - Jira: 'bugtracker/jira.md'
      - Gitlab: 'bugtracker/gitlab.md'
      - Github: 'bugtracker/github.md'
  - References: references.md
  - Product Page: 'https://www.microfocus.com/en-us/cyberres/application-security'
  - Announcements: 'https://community.microfocus.com/cyberres/fortify/w/fortify-product-announcements'
  - Fortify Unplugged: 'https://www.youtube.com/@FortifyUnplugged'
  - Community: 'https://community.microfocus.com/cyberres/fortify/'
  - Support Portal: 'https://www.microfocus.com/en-us/support/login'