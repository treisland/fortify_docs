site_name: Fortify Developer Guide
site_url: https://fortify-docs.example.com


extra_css:
  - stylesheets/main.css
  - stylesheets/dark.css
  - stylesheets/light.css

extra:
  version:
    provider: mike
    default: latest
  
theme:
  name: material
  custom_dir: overrides
  font:
    text: 'Segoe UI'
  logo: assets/fortify_mark_electric-blue-56px.png
  favicon: assets/fortify_mark_electric-blue-56px.png
  palette:
    - scheme: slate
      primary: blue
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to light mode
    
    - scheme: default
      primary: blue
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to dark mode
  features:
    - announce.dismiss
    - content.code.annotate
    - content.code.copy
    - content.tooltips
    - navigation.indexes
    - navigation.footer
    - navigation.instant
    - navigation.path
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.suggest
    
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.inlinehilite
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
          - name: mermaid
            class: mermaid
            format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true 
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      options:
        custom_icons:
          - overrides/.icons
  - toc:
      permalink: true
      title: Table Of Contents

plugins:
  - blog:
  - glightbox
  - macros
  - mkdocs-video
  - search
  - git-revision-date-localized:
      enable_creation_date: false
      type: timeago
  - tags:
      tags_file: tags.md

nav:
  - Home: index.md
  - Platform:
      - Deployments: fortify_101/deployments.md
      - Solutions:
          - Overview: fortify_101/solutions.md
          - Testing Tools: fortify_101/tools.md
      - Languages: fortify_101/languages.md
      - Integrations: fortify_101/integrations.md
  - Guides:
      - blog/index.md
  - Resources: resources.md
  - Downloads & Support: downloads.md
  - FAQ: faq.md

